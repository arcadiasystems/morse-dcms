name: release

# Publishes one package to npm when its release tag is pushed:
#   v<version>            morse-sdk  as @arcadiasystems/morse-sdk
#   morse-cli-v<version>  morse-cli  as @arcadiasystems/morse-cli
# The publish authenticates with npm Trusted Publishing (OIDC), so there is no
# npm token anywhere. Each package's trusted publisher on npmjs.com names this
# file and the npm-publish environment: renaming either breaks publishing.
# RELEASING.md describes the whole procedure.

on:
  push:
    tags:
      - "v*"
      - "morse-cli-v*"

permissions:
  contents: read

jobs:
  # Everything that can refuse a release runs here, before anyone is asked to
  # approve the publish, and with no publish rights.
  verify:
    name: verify and pack
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.package.outputs.dir }}
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      # Full history, so the tagged commit can be compared with main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the package from the tag
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            morse-cli-v*)
              dir=morse-cli
              version="${GITHUB_REF_NAME#morse-cli-v}"
              ;;
            v*)
              dir=morse-sdk
              version="${GITHUB_REF_NAME#v}"
              ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME is not a release tag."
              exit 1
              ;;
          esac
          # A pre-release version would need its own npm dist-tag, which this
          # workflow does not choose.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $GITHUB_REF_NAME does not end in a plain x.y.z version."
            exit 1
          fi
          {
            echo "dir=$dir"
            echo "name=$(jq -r .name "$dir/package.json")"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main. Release only merged commits."
            exit 1
          fi
      - name: Tag matches the package version
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.dir }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          manifest_version="$(jq -r .version "$PACKAGE_DIR/package.json")"
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $VERSION, but $PACKAGE_DIR/package.json says $manifest_version."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Version is not on npm yet
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          published="$(npm view "$PACKAGE_NAME" versions --json)"
          if printf '%s' "$published" | jq -e --arg v "$VERSION" '[.] | flatten | index($v) != null' > /dev/null; then
            echo "::error::$PACKAGE_NAME@$VERSION is already on npm. Bump the version and tag again."
            exit 1
          fi
      # The published CLI installs the SDK from npm, not from this workspace,
      # so the SDK release it asks for has to be there first.
      - name: SDK the CLI depends on is on npm
        if: steps.package.outputs.dir == 'morse-cli'
        run: |
          sdk_range="$(jq -r '.dependencies["@arcadiasystems/morse-sdk"]' morse-cli/package.json)"
          if [ -z "$(npm view "@arcadiasystems/morse-sdk@$sdk_range" version)" ]; then
            echo "::error::No published @arcadiasystems/morse-sdk matches $sdk_range. Release the SDK first."
            exit 1
          fi
      # Pinned: bun.lock is lockfileVersion 2, which bun 1.3.x rejects. Keep
      # this in step with sdk-ci.yml and cli-ci.yml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install (workspace root)
        run: bun install --frozen-lockfile
      # As in cli-ci.yml: the CLI resolves @arcadiasystems/morse-sdk to the
      # workspace package, whose dist/ is gitignored, so build it before the
      # CLI gate typechecks and tests against it.
      - name: Build SDK (CLI dependency)
        if: steps.package.outputs.dir == 'morse-cli'
        working-directory: morse-sdk
        run: bun run build
      # The package's own publish gate, ending in a fresh build. Run here
      # because the publish job ships the packed tarball, and npm runs
      # prepublishOnly only when it publishes from a package directory.
      - name: Release gate (prepublishOnly)
        working-directory: ${{ steps.package.outputs.dir }}
        run: bun run prepublishOnly
      - name: Pack
        id: pack
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/tarball"
          tarball="$(npm pack --json --pack-destination "$RUNNER_TEMP/tarball" | jq -r '.[0].filename')"
          tar -tzf "$RUNNER_TEMP/tarball/$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      # npm publishes package.json as it is, and bun accepts workspace:
      # specifiers, so nothing else would stop one from reaching the registry,
      # where no other package manager can resolve it.
      - name: Packed manifest has no workspace specifiers
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          leaked="$(tar -xzOf "$RUNNER_TEMP/tarball/$TARBALL" package/package.json \
            | jq -r '[.dependencies, .peerDependencies, .optionalDependencies]
                | map(select(. != null) | to_entries[])
                | map(select(.value | startswith("workspace:")) | "\(.key)@\(.value)")
                | join(", ")')"
          if [ -n "$leaked" ]; then
            echo "::error::The packed package.json depends on $leaked. Replace it with a published version range."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # Waits for a reviewer of the npm-publish environment, then publishes the
  # tarball that `verify` built. No checkout and no install: this is the only
  # job that can mint an npm credential, so it runs no code from the repository.
  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      # Trusted publishing needs Node 22.14.0 or later and npm 11.5.1 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Without this, an older npm fails the publish with an authentication
      # error that says nothing about the version.
      - name: npm supports trusted publishing
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $current is older than $required, the first release with trusted publishing."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball
      # No token and no --provenance: npm exchanges the job's OIDC identity
      # for a short-lived credential and attaches provenance on its own.
      - name: Publish
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: npm publish "$RUNNER_TEMP/tarball/$TARBALL" --access public

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The notes are the version's own CHANGELOG section, heading included,
      # as in the releases made by hand before this workflow.
      - name: Extract release notes from the CHANGELOG
        env:
          PACKAGE_DIR: ${{ needs.verify.outputs.dir }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            /^## \[/ { in_section = (index($0, heading) == 1) }
            in_section { print }
          ' "$PACKAGE_DIR/CHANGELOG.md" > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::$PACKAGE_DIR/CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
      # A draft prepared for the tag in advance is published with these notes
      # instead of colliding with a second release.
      - name: Create or publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.verify.outputs.dir }} v${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
